<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GigiAI - Pizzeria Da Gigi</title>
    <style>
        body {
            font-family: "SF Pro Display", -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: #0a0a0a;
            color: #ffffff;
            margin: 0;
            padding: 0;
            height: 100vh;
            height: 100dvh;
            box-sizing: border-box;
            overflow: hidden;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            height: 100vh;
            height: 100dvh;
            box-sizing: border-box;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
        }

        .logo {
            text-align: center;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .chat-container {
            border: 1px solid #333;
            padding: 12px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            flex: 1 1 auto;
            min-height: 0;
            max-height: 170px;
        }

        .chat-messages {
            flex: 1 1 auto;
            min-height: 0;
            overflow-y: auto;
            margin-bottom: 10px;
            padding: 8px;
            font-size: 13px;
        }

        .message {
            margin-bottom: 20px;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.5;
            max-width: 70%;
            clear: both;
        }

        .message.user {
            background-color: #2c2c2c;
            float: right;
            border-bottom-right-radius: 2px;
            border: 1px solid #404040;
        }

        .message.assistant {
            background-color: #262626;
            float: left;
            border-bottom-left-radius: 2px;
            border: 1px solid #333;
        }

        .controls {
            text-align: center;
            margin-top: 10px;
            flex-shrink: 0;
        }

        button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px 24px;
            background-color: transparent;
            color: #ffffff;
            border: 1px solid #ffffff;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
            position: relative;
        }

        button:hover {
            border-width: 2px;
            transform: scale(1.02);
            box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
        }

        #audio-output {
            display: none;
        }

        .icon-with-spinner {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-width: 180px;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid #ffffff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            flex-shrink: 0;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        .pulse-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .pulse-circle {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background-color: #ffffff;
            opacity: 0.2;
            flex-shrink: 0;
            transform: scale(var(--audio-level, 1));
            transition: transform 0.1s ease;
        }

        .mute-toggle {
            width: 24px;
            height: 24px;
            cursor: pointer;
            flex-shrink: 0;
        }

        .mute-toggle svg {
            display: block;
            width: 100%;
            height: 100%;
        }

        .toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 16px 24px;
            border-radius: 4px;
            font-size: 14px;
            z-index: 1000;
            display: none;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.2);
        }

        .toast.error {
            background-color: #f44336;
            color: white;
        }

        .toast.warning {
            background-color: #ffd700;
            color: black;
        }

        .voice-orb {
            position: relative;
            width: 190px;
            height: 190px;
            margin: 4px auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .glow-disc {
            position: absolute;
            left: 50%;
            top: 50%;
            border-radius: 50%;
            filter: blur(20px);
            opacity: 0.28;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .glow-disc--outer {
            width: 190px;
            height: 190px;
            background: conic-gradient(from 0deg, #ff6b35, #ffd23f, #f72585, #7209b7, #ff6b35);
            animation: orbSpinCW 7s linear infinite;
        }

        .glow-disc--inner {
            width: 128px;
            height: 128px;
            background: conic-gradient(from 90deg, #f72585, #4361ee, #ffd23f, #f72585);
            animation: orbSpinCCW 5s linear infinite;
        }

        .voice-orb.is-connecting .glow-disc {
            opacity: 0.45;
        }

        .voice-orb.is-active .glow-disc {
            opacity: calc(0.45 + 0.5 * var(--audio-level, 0));
        }

        @keyframes orbSpinCW {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to   { transform: translate(-50%, -50%) rotate(360deg); }
        }

        @keyframes orbSpinCCW {
            from { transform: translate(-50%, -50%) rotate(0deg); }
            to   { transform: translate(-50%, -50%) rotate(-360deg); }
        }

        .orb-center {
            position: relative;
            z-index: 2;
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: #111111;
            border: 1px solid #333;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .orb-text-ring {
            position: absolute;
            left: 50%;
            top: 50%;
            width: 0;
            height: 0;
            animation: orbTextSpin 16s linear infinite;
        }

        .orb-text-ring span {
            position: absolute;
            left: 0;
            top: 0;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffffff;
            opacity: 0.7;
            transform-origin: 0 0;
            white-space: pre;
        }

        @keyframes orbTextSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }

        .pizza-ticker {
            overflow: hidden;
            width: 100%;
            max-width: 800px;
            margin: 0 auto 12px;
            border-top: 1px solid #333;
            border-bottom: 1px solid #333;
            padding: 8px 0;
            flex-shrink: 0;
        }

        .pizza-ticker-track {
            display: inline-flex;
            white-space: nowrap;
            animation: pizzaTickerScroll 40s linear infinite;
        }

        .pizza-ticker-track span {
            margin: 0 18px;
            font-size: 13px;
            letter-spacing: 0.5px;
            color: #aaaaaa;
        }

        @keyframes pizzaTickerScroll {
            from { transform: translateX(0); }
            to   { transform: translateX(-50%); }
        }

        .back-link {
            display: inline-block;
            color: #aaaaaa;
            text-decoration: none;
            font-size: 13px;
            letter-spacing: 0.5px;
            padding: 6px 0;
            flex-shrink: 0;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .status-line {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 14px;
            letter-spacing: 0.5px;
            color: #cccccc;
            min-height: 24px;
        }

        .call-actions {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            margin-top: 8px;
        }

        .end-call-btn {
            background: transparent;
            border: 1px solid #555;
            color: #cccccc;
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
        }

        .end-call-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
        }

        /* Striscia in alto (NON copre la pagina) se il telefono blocca l'audio */
        .audio-unlock-overlay {
            position: fixed; top: 12px; left: 16px; right: 16px; z-index: 2000;
            background: #e8892b; color: #111; border-radius: 12px;
            padding: 14px 16px; text-align: center; font-size: 17px; font-weight: 600;
            box-shadow: 0 6px 24px rgba(0,0,0,0.5); cursor: pointer;
        }
        .audio-unlock-overlay[hidden] { display: none; }
        .sottotitolo { text-align: center; color: #d9d9d9; font-size: 15px; margin: -4px 0 8px; }

        /* --- Avvio con un tocco (sblocca microfono e audio su iPhone) --- */
        .start-overlay {
            position: fixed; inset: 0; z-index: 2100;
            background: rgba(0, 0, 0, 0.88);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 18px; padding: 32px; box-sizing: border-box; text-align: center;
        }
        .start-overlay[hidden] { display: none; }
        .start-btn {
            background: #e8892b; color: #111; border: 0; border-radius: 999px;
            font-size: 19px; font-weight: 600; padding: 18px 34px; cursor: pointer;
        }
        .start-note { color: #aaa; font-size: 14px; max-width: 300px; line-height: 1.4; }

        /* --- Riquadro con l'ordine registrato da GigiAI --- */
        .ordine-box {
            border: 1px solid #e8892b; border-radius: 12px; padding: 12px 14px;
            margin: 10px 0; background: rgba(232, 137, 43, 0.08); font-size: 15px;
        }
        .ordine-box[hidden] { display: none; }
        .ordine-titolo { font-size: 12px; letter-spacing: 1px; text-transform: uppercase; color: #e8892b; margin-bottom: 6px; }
        .ordine-riga { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
        .ordine-totale { display: flex; justify-content: space-between; border-top: 1px solid #444; margin-top: 6px; padding-top: 6px; font-weight: 700; }
        .paga-btn {
            display: block; text-align: center; margin-top: 12px; padding: 14px;
            background: #e8892b; color: #111; border-radius: 10px; font-weight: 700;
            text-decoration: none; font-size: 17px;
        }
        .paga-btn[hidden] { display: none; }
    </style>
</head>

<body>
    <div id="error-toast" class="toast"></div>
    <div id="audio-unlock-overlay" class="audio-unlock-overlay" hidden>
        🔊 Tocca qui per ascoltare Gavina
    </div>
    <div class="container">
        <a class="back-link" href="https://pizzeria-da-gigi-sito.onrender.com/">&larr; Torna al menu</a>
        <div class="logo">
            <h1>🍕 GigiAI</h1>
        </div>
        <div class="sottotitolo">Ti risponde Gavina, l'assistente vocale di Gigi</div>
        <div class="voice-orb" id="voice-orb">
            <div class="glow-disc glow-disc--outer"></div>
            <div class="glow-disc glow-disc--inner"></div>
            <div class="orb-text-ring" id="orb-text-ring"></div>
            <div class="orb-center">🍕</div>
        </div>
        <div class="pizza-ticker" aria-hidden="true">
            <div class="pizza-ticker-track" id="pizza-ticker-track"></div>
        </div>
        <div class="ordine-box" id="ordine-box" hidden>
            <div class="ordine-titolo">Il tuo ordine</div>
            <div id="ordine-righe"></div>
            <div class="ordine-totale"><span>Totale</span><span id="ordine-totale"></span></div>
            <a class="paga-btn" id="paga-btn" hidden href="#">Procedi al pagamento →</a>
        </div>
        <div class="chat-container">
            <div class="chat-messages" id="chat-messages"></div>
        </div>
        <div class="controls" id="controls">
            <div class="status-line" id="status-line">Connessione a GigiAI...</div>
            <div class="call-actions" id="call-actions" hidden>
                <div class="mute-toggle" id="mute-toggle"></div>
                <button class="end-call-btn" id="end-call-btn">Termina conversazione</button>
            </div>
        </div>
    </div>
    <audio id="audio-output"></audio>

    <script>
        let peerConnection;
        let webrtc_id;
        let isMuted = false;
        let isConnecting = false;
        const audioOutput = document.getElementById('audio-output');
        const chatMessages = document.getElementById('chat-messages');

        const PIZZA_MENU_NAMES = [
            'Marinara', 'Margherita', 'Romana', 'Toscana', 'Completa', 'Imperiale',
            'Cardinale', 'Veneziana', 'Wurstel', 'Canadese', 'Diavola', 'Salsiccia',
            'Sarda', 'Boscanola', 'Arrabbiata', 'Quattro Stagioni', 'Capricciosa',
            'Tucano', 'Calzone', 'Calzone Farcito', 'Gorgonzola', 'Quattro Formaggi',
            'Pesto', 'Sassarese', 'Greca', 'Ortolana', 'Antunna', 'Porcini',
            'Tirolese', 'Patatosa', 'Furia', 'Bresaola', 'San Daniele', 'Primavera',
            'Logudoresse', 'Salmone', 'Catalana', 'Carbonara', 'Mare e Monti', 'Campagnola'
        ];

        function buildTextRing() {
            const ring = document.getElementById('orb-text-ring');
            if (!ring) return;
            const phrase = 'DILLO A GIGIAI  \u2022  ';
            const text = phrase.repeat(3);
            const chars = text.split('');
            const angleStep = 360 / chars.length;
            const radius = 92;
            chars.forEach((char, i) => {
                const span = document.createElement('span');
                span.textContent = char;
                const angle = i * angleStep;
                span.style.transform = `rotate(${angle}deg) translate(${radius}px) rotate(90deg)`;
                ring.appendChild(span);
            });
        }

        function renderPizzaTicker() {
            const track = document.getElementById('pizza-ticker-track');
            if (!track) return;
            const names = PIZZA_MENU_NAMES.concat(PIZZA_MENU_NAMES);
            track.innerHTML = names.map(name => `<span>\ud83c\udf55 ${name}</span>`).join('');
        }

        function updateOrbState() {
            const orb = document.getElementById('voice-orb');
            if (!orb) return;
            orb.classList.remove('is-connecting', 'is-active');
            if (peerConnection && peerConnection.connectionState === 'connected') {
                orb.classList.add('is-active');
            } else if (peerConnection && (peerConnection.connectionState === 'connecting' || peerConnection.connectionState === 'new')) {
                orb.classList.add('is-connecting');
            }
        }

        buildTextRing();
        renderPizzaTicker();

        let audioLevel = 0;
        let animationFrame;
        let audioContext, analyser, audioSource;

        const micIconSVG = `
            <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
            </svg>`;

        const micMutedIconSVG = `
            <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                <line x1="12" y1="19" x2="12" y2="23"></line>
                <line x1="8" y1="23" x2="16" y2="23"></line>
                <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>`;

        function updateStatusUI() {
            updateOrbState();
            const statusLine = document.getElementById('status-line');
            const callActions = document.getElementById('call-actions');
            const muteToggle = document.getElementById('mute-toggle');
            statusLine.innerHTML = '';

            if (peerConnection && (peerConnection.connectionState === 'connecting' || peerConnection.connectionState === 'new')) {
                const spinner = document.createElement('div');
                spinner.className = 'spinner';
                const text = document.createElement('span');
                text.textContent = 'Connessione a GigiAI...';
                statusLine.appendChild(spinner);
                statusLine.appendChild(text);
                callActions.hidden = true;
            } else if (peerConnection && peerConnection.connectionState === 'connected') {
                const pulseCircle = document.createElement('div');
                pulseCircle.className = 'pulse-circle';
                const text = document.createElement('span');
                text.textContent = 'GigiAI ti sta ascoltando';
                statusLine.appendChild(pulseCircle);
                statusLine.appendChild(text);

                callActions.hidden = false;
                muteToggle.innerHTML = isMuted ? micMutedIconSVG : micIconSVG;
            } else {
                statusLine.textContent = 'Conversazione terminata';
                callActions.hidden = true;
            }
        }

        function toggleMute() {
            if (!peerConnection || peerConnection.connectionState !== 'connected') return;

            isMuted = !isMuted;
            console.log("Mute toggled:", isMuted);

            peerConnection.getSenders().forEach(sender => {
                if (sender.track && sender.track.kind === 'audio') {
                    sender.track.enabled = !isMuted;
                    console.log(`Audio track ${sender.track.id} enabled: ${!isMuted}`);
                }
            });

            updateStatusUI();
        }

        document.getElementById('mute-toggle').addEventListener('click', toggleMute);
        document.getElementById('end-call-btn').addEventListener('click', () => stop());

        function setupAudioVisualization(stream) {
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioContext.createAnalyser();
            audioSource = audioContext.createMediaStreamSource(stream);
            audioSource.connect(analyser);
            analyser.fftSize = 64;
            const dataArray = new Uint8Array(analyser.frequencyBinCount);

            function updateAudioLevel() {
                analyser.getByteFrequencyData(dataArray);
                const average = Array.from(dataArray).reduce((a, b) => a + b, 0) / dataArray.length;
                audioLevel = average / 255;

                const pulseCircle = document.querySelector('.pulse-circle');
                if (pulseCircle) {
                    pulseCircle.style.setProperty('--audio-level', 1 + audioLevel);
                }

                const orb = document.getElementById('voice-orb');
                if (orb) {
                    orb.style.setProperty('--audio-level', audioLevel);
                }

                animationFrame = requestAnimationFrame(updateAudioLevel);
            }
            updateAudioLevel();
        }

        function showError(message) {
            const toast = document.getElementById('error-toast');
            toast.textContent = message;
            toast.className = 'toast error';
            toast.style.display = 'block';

            setTimeout(() => {
                toast.style.display = 'none';
            }, 5000);
        }

        async function setupWebRTC() {
            isConnecting = true;
            const config = __RTC_CONFIGURATION__ || {
                iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
            };
            peerConnection = new RTCPeerConnection(config);

            const timeoutId = setTimeout(() => {
                const toast = document.getElementById('error-toast');
                toast.textContent = "La connessione sta impiegando piu' del solito. Sei per caso su una VPN?";
                toast.className = 'toast warning';
                toast.style.display = 'block';

                setTimeout(() => {
                    toast.style.display = 'none';
                }, 5000);
            }, 5000);

            try {
                const stream = await navigator.mediaDevices.getUserMedia({
                    audio: true
                });

                setupAudioVisualization(stream);
                riproduciSalutoRegistrato();

                stream.getTracks().forEach(track => {
                    peerConnection.addTrack(track, stream);
                });

                peerConnection.addEventListener('track', (evt) => {
                    if (audioOutput.srcObject !== evt.streams[0]) {
                        audioOutput.srcObject = evt.streams[0];
                        tentaAudio();
                    }
                });

                peerConnection.onicecandidate = ({ candidate }) => {
                    if (candidate) {
                        console.debug("Sending ICE candidate", candidate);
                        fetch('/webrtc/offer', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                candidate: candidate.toJSON(),
                                webrtc_id: webrtc_id,
                                type: "ice-candidate",
                            })
                        })
                    }
                };

                const dataChannel = peerConnection.createDataChannel('text');
                dataChannel.onmessage = (event) => {
                    const eventJson = JSON.parse(event.data);
                    if (eventJson.type === "error") {
                        showError(eventJson.message);
                    }
                };

                const offer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(offer);

                peerConnection.addEventListener('connectionstatechange', () => {
                    console.log('connectionstatechange', peerConnection.connectionState);
                    if (peerConnection.connectionState === 'connected') {
                        clearTimeout(timeoutId);
                        const toast = document.getElementById('error-toast');
                        toast.style.display = 'none';
                    }
                    updateStatusUI();
                });

                webrtc_id = Math.random().toString(36).substring(7);

                const response = await fetch('/webrtc/offer', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        sdp: peerConnection.localDescription.sdp,
                        type: peerConnection.localDescription.type,
                        webrtc_id: webrtc_id
                    })
                });

                if (!response.ok) {
                    throw new Error(`Server returned ${response.status}: ${response.statusText}`);
                }

                const serverResponse = await response.json();
                console.log('Server response:', serverResponse);

                if (serverResponse.status === 'failed') {
                    showError(serverResponse.meta.error === 'concurrency_limit_reached'
                        ? `Troppe connessioni contemporanee. Il limite massimo e' ${serverResponse.meta.limit}`
                        : serverResponse.meta.error);
                    stop();
                    return;
                }

                await peerConnection.setRemoteDescription(serverResponse);

                const eventSource = new EventSource('/outputs?webrtc_id=' + webrtc_id);
                eventSource.addEventListener("output", (event) => {
                    const eventJson = JSON.parse(event.data);
                    if (eventJson.type === 'ordine') {
                        mostraOrdine(eventJson);
                    } else if (eventJson.type === 'pagamento') {
                        mostraPagamento(eventJson.url);
                    } else if (eventJson.role) {
                        addMessage(eventJson.role, eventJson.content);
                    }
                });
            } catch (err) {
                clearTimeout(timeoutId);
                console.error('Error setting up WebRTC:', err);
                showError(`Connessione fallita: ${err.message || err}`);
                stop();
            }
        }

        function formattaEuro(v) {
            return Number(v || 0).toFixed(2).replace('.', ',') + ' €';
        }

        function mostraOrdine(dati) {
            const box = document.getElementById('ordine-box');
            const contenitore = document.getElementById('ordine-righe');
            contenitore.innerHTML = '';
            (dati.righe || []).forEach(r => {
                const riga = document.createElement('div');
                riga.className = 'ordine-riga';
                const nome = document.createElement('span');
                nome.textContent = r.quantita + '× ' + r.nome + ' (' + r.formato + ')';
                const prezzo = document.createElement('span');
                prezzo.textContent = formattaEuro(r.subtotale);
                riga.append(nome, prezzo);
                contenitore.appendChild(riga);
            });
            document.getElementById('ordine-totale').textContent = formattaEuro(dati.totale);
            box.hidden = !(dati.righe && dati.righe.length);
            // Se l'ordine cambia dopo la conferma, il pulsante va richiesto di nuovo.
            document.getElementById('paga-btn').hidden = true;
        }

        function mostraPagamento(url) {
            const btn = document.getElementById('paga-btn');
            btn.href = url;
            btn.hidden = false;
            document.getElementById('ordine-box').hidden = false;
            btn.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function addMessage(role, content) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', role);
            messageDiv.textContent = content;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function stop() {
            if (animationFrame) {
                cancelAnimationFrame(animationFrame);
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
                analyser = null;
                audioSource = null;
            }
            if (peerConnection) {
                if (peerConnection.getTransceivers) {
                    peerConnection.getTransceivers().forEach(transceiver => {
                        if (transceiver.stop) {
                            transceiver.stop();
                        }
                    });
                }

                if (peerConnection.getSenders) {
                    peerConnection.getSenders().forEach(sender => {
                        if (sender.track && sender.track.stop) sender.track.stop();
                    });
                }
                console.log('closing');
                peerConnection.close();
            }
            updateStatusUI();
            audioLevel = 0;
        }

        // Saluto di Gavina: il server lo fa partire solo quando qui l'audio
        // e' davvero attivo, cosi' su iPhone non va perso.
        let salutoRichiesto = false;
        let audioPronto = false;
        // 'in_corso' | 'ok' | 'fallito': se il saluto registrato non parte,
        // si chiede a Gavina di salutare dal vivo.
        let statoSalutoRegistrato = 'in_corso';

        function riproduciSalutoRegistrato() {
            const saluto = new Audio('/saluto.mp3');
            saluto.addEventListener('error', () => {
                statoSalutoRegistrato = 'fallito';
                segnalaAudioPronto();
            });
            saluto.play().then(() => {
                statoSalutoRegistrato = 'ok';
            }).catch(() => {
                statoSalutoRegistrato = 'fallito';
                segnalaAudioPronto();
            });
        }

        function segnalaAudioPronto() {
            if (!audioPronto || statoSalutoRegistrato !== 'fallito') return;
            if (salutoRichiesto || !webrtc_id) return;
            salutoRichiesto = true;
            fetch('/saluto', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ webrtc_id: webrtc_id })
            }).catch(() => {});
        }

        function tentaAudio() {
            const striscia = document.getElementById('audio-unlock-overlay');
            let bloccato = false;
            audioOutput.play().then(() => {
                striscia.hidden = true;
                audioPronto = true;
                segnalaAudioPronto();
            }).catch(() => {
                bloccato = true;
                striscia.hidden = false;
            });
            // Su alcuni browser play() resta "in attesa" finche' non arriva
            // audio: se non e' stato rifiutato, l'audio e' consentito.
            setTimeout(() => { if (!bloccato) { audioPronto = true; segnalaAudioPronto(); } }, 1000);
        }

        // Un tocco in qualunque punto sblocca l'audio se era bloccato.
        document.addEventListener('click', () => {
            const striscia = document.getElementById('audio-unlock-overlay');
            if (striscia.hidden || !audioOutput.srcObject) return;
            audioOutput.play().then(() => {
                striscia.hidden = true;
                audioPronto = true;
                segnalaAudioPronto();
            }).catch(() => {});
        });

        // Si parte subito, appena si entra nella pagina.
        setupWebRTC();
    </script>
</body>

</html>
